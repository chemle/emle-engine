name: Release

on:
  push:
    branches: [devel]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Conda build number, increased to replace a bad release"
        type: number
        default: 0

jobs:
  build-pypi:
    name: Build PyPI distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.label.outputs.label }}
    env:
      # PyPI and conda reject local version labels ("+g<hash>.d<date>"), so
      # drop them for release builds only. Local/dev installs keep them, so
      # that bug reports from modified checkouts are identifiable.
      SETUPTOOLS_SCM_OVERRIDES_FOR_EMLE_ENGINE: '{local_scheme = "no-local-version"}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Release tags on main publish to PyPI and the main label, devel to the
      # dev label, and anything else (including dev tags) is build only.
      - name: Determine the publish label
        id: label
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != *dev* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
            echo "label=main" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/devel ]]; then
            echo "label=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build==1.6.1 setuptools-scm==10.3.4
      - name: Build sdist and wheel
        run: python -m build
      - name: Determine package version
        id: version
        run: echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"
      - name: Copy sdist for conda build
        run: cp dist/*.tar.gz emle-engine-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conda-source
          path: emle-engine-source.tar.gz

  publish-pypi:
    name: Publish to PyPI
    needs: build-pypi
    if: needs.build-pypi.outputs.label == 'main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emle-engine/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  build-conda:
    name: Build conda package (noarch)
    needs: build-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: conda-source
          path: .
      - name: Build conda package with rattler-build
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          recipe-path: recipes/emle-engine/recipe.yaml
          artifact-name: conda-dist
        env:
          PKG_VERSION: ${{ needs.build-pypi.outputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number || 0 }}

  publish-conda:
    name: Publish to chemle Anaconda.org channel
    needs: [build-pypi, build-conda]
    if: needs.build-pypi.outputs.label != ''
    runs-on: ubuntu-latest
    environment: anaconda
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: conda-dist
          path: conda-dist
      - name: Install anaconda-client
        run: python -m pip install anaconda-client==1.16.0
      - name: Upload to the chemle Anaconda.org channel
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          LABEL: ${{ needs.build-pypi.outputs.label }}
        run: |
          shopt -s globstar
          anaconda --token "$ANACONDA_API_TOKEN" upload --user chemle \
            --label "$LABEL" --skip-existing conda-dist/**/*.conda
      - name: Remove all but the newest three dev builds
        if: needs.build-pypi.outputs.label == 'dev'
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          curl -fsS -H "Authorization: token $ANACONDA_API_TOKEN" \
            https://api.anaconda.org/package/chemle/emle-engine/files > files.json
          python - <<'EOF' > stale.txt
          import json
          files = [f for f in json.load(open("files.json")) if f["labels"] == ["dev"]]
          newest = {}
          for f in files:
              newest[f["version"]] = max(newest.get(f["version"], ""), f["upload_time"])
          keep = sorted(newest, key=newest.get, reverse=True)[:3]
          for f in files:
              if f["version"] not in keep:
                  print(f"chemle/emle-engine/{f['version']}/{f['basename']}")
          EOF
          while read -r spec; do
            anaconda --token "$ANACONDA_API_TOKEN" remove --force "$spec"
          done < stale.txt
